[project]
name = "bhzd-agent-server-py"
version = "0.0.0"
description = "标航智导教学 Agent 平台后端（全权重构版）"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1.0",
  "cryptography>=42.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  # Vector scoring runs on request paths; NumPy avoids Python-level loops once
  # a production corpus grows beyond the small deterministic-demo data set.
  "numpy>=2.0.0",
  "openpyxl>=3.1.0",
  # Persisted message previews are derived with strict decoder and output bounds.
  "pillow>=12.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pypdf>=4.0.0",
  # FastAPI validates UploadFile/Form routes at import time, so this must be
  # an explicit runtime dependency rather than an incidental global install.
  "python-multipart>=0.0.20",
  "python-docx>=1.1.0",
  "uvicorn>=0.30.0",
  "websockets>=12.0",
  "rapidocr-onnxruntime>=1.4.4",
  "pypdfium2>=4.30.0",
]

[dependency-groups]
# Test and static-analysis tools stay out of production installations while
# remaining reproducible through uv's locked development dependency group.
dev = [
  "mypy>=1.10.0",
  "pre-commit>=4.0.0",
  "pytest>=8.2.0",
  "ruff>=0.12.0",
]

[tool.ruff]
# Keep the first blocking lint gate focused on correctness defects; broader
# style rules are introduced incrementally through the formatter workflow.
target-version = "py311"
line-length = 100
extend-exclude = ["bhzd_py/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Match the established TypeScript-like source style to avoid needless churn
# while new and touched Python files are formatted automatically.
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
# Existing modules are gradually annotated, so mypy runs over application code
# with third-party import gaps suppressed until a fully typed baseline exists.
python_version = "3.11"
files = ["bhzd_py"]
exclude = ["bhzd_py/migrations"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
# 测试以 server/ 为根运行（pythonpath="."），使 bhzd_py 可被直接导入；
# 在仓库根执行 `python -m pytest server/tests` 时 pytest 同样会应用本配置。
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  # Quality cases are deterministic and offline, but remain separately selectable
  # because they assert product-answer contracts rather than transport behavior.
  "slow: answer-quality and broader regression cases that CI may select separately",
]
