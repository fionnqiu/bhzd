[project]
name = "bhzd-agent-server-py"
version = "0.0.0"
description = "标航智导教学 Agent 平台后端（全权重构版）"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1.0",
  "cryptography>=42.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pypdf>=4.0.0",
  # FastAPI validates UploadFile/Form routes at import time, so this must be
  # an explicit runtime dependency rather than an incidental global install.
  "python-multipart>=0.0.20",
  "pytest>=8.2.0",
  "python-docx>=1.1.0",
  "uvicorn>=0.30.0",
  "websockets>=12.0",
]

[tool.pytest.ini_options]
# 测试以 server/ 为根运行（pythonpath="."），使 bhzd_py 可被直接导入；
# 在仓库根执行 `python -m pytest server/tests` 时 pytest 同样会应用本配置。
pythonpath = ["."]
testpaths = ["tests"]
